<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پەڕەی تایبەت</title>
    <!-- هێنانی فۆنتی جوانی کوردی/عەرەبی لە گۆگڵ (Aref Ruqaa) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Amiri:ital,wght@0,400;0,700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Aref Ruqaa', 'Amiri', serif;
        }

        /* ستایلی ڤیدۆی یەکەم */
        #intro-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 10;
        }

        /* ناوەڕۆکی بەشی دووەم (دوای تەواوبوونی ڤیدۆکە) */
        #main-content {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* وێنەی باکگراوندەکە */
            background-image: url('https://raw.githubusercontent.com/farzadkhdr/ktebe-yadgare/main/IMG_9806.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-y: auto;
        }

        /* وێنە گەورەکەی سەر باکگراوندەکە */
        #center-image {
            max-width: 85%;
            max-height: 45vh;
            object-fit: contain;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            margin-bottom: 20px;
        }

        /* نوسینەکەی سەر باکگراوند (لە ژێر وێنەکە) */
        .background-text {
            width: 90%;
            max-width: 600px;
            color: #ffffff;
            text-align: center;
            font-size: 1.2rem;
            line-height: 1.9;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.9), 0 0 20px rgba(0, 0, 0, 0.8);
            background: rgba(0, 0, 0, 0.4); /* باکگراوندێکی روون بۆ ئەوەی لەسەر وێنەی پاشبنەماکە روونتر دەربکەوێت */
            padding: 18px 22px;
            border-radius: 15px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        /* دوگمەی دەستپێکردن */
        #start-btn {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            padding: 15px 35px;
            font-size: 20px;
            background: #ffffff;
            color: #111;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4);
            font-weight: bold;
            font-family: 'Aref Ruqaa', serif;
        }
    </style>
</head>
<body>

    <!-- دوگمەی دەستپێکردن -->
    <button id="start-btn" onclick="startExperience()">داگرە بۆ دەستپێکردن ❤️</button>

    <!-- ڤیدۆی یەکەم -->
    <video id="intro-video" playsinline preload="auto">
        <source src="https://raw.githubusercontent.com/farzadkhdr/ktebe-yadgare/main/a_The_book_opens%2C_and_.mp4" type="video/mp4">
    </video>

    <!-- ناوەڕۆکی دووەم -->
    <div id="main-content">
        <!-- وێنەکە -->
        <img id="center-image" src="https://raw.githubusercontent.com/farzadkhdr/ktebe-yadgare/main/IMG_9802.jpeg" alt="Main Image">
        
        <!-- نوسینەکە لەسەر باکگراوند لە ژێر وێنەکە -->
        <div class="background-text">
            یادگاریەکی وات لەگەڵ دروست دەکەم لە دونیاکەی تریش پەشیمان نەبی لە هەڵبژاردنم سوێند بەخوا چاوەکانم بەس تۆ دەبیین لەتۆ زیاتر کێ دەتوانی بچێتە دڵی من. گەورەیی خۆشەویستیت بیگومان بۆمن وەسف ناکرێ 🥲🦋💋💋💋💋
            <br><br>
            رەیانممم قوربانت بم ئیهــــــــــــــــــــــــــــــ چاو زەیتونەکەم
        </div>
    </div>

    <!-- فایلی دەنگی دووەم -->
    <audio id="bg-audio" preload="auto">
        <source src="https://raw.githubusercontent.com/farzadkhdr/ktebe-yadgare/main/-1863885848778464690.mp4" type="audio/mp4">
    </audio>

    <script>
        const introVideo = document.getElementById('intro-video');
        const mainContent = document.getElementById('main-content');
        const bgAudio = document.getElementById('bg-audio');
        const startBtn = document.getElementById('start-btn');

        function startExperience() {
            startBtn.style.display = 'none';
            introVideo.play().catch(error => {
                console.log("Error playing video: ", error);
            });
        }

        introVideo.onended = function() {
            introVideo.style.display = 'none';
            mainContent.style.display = 'flex';
            bgAudio.play().catch(error => {
                console.log("Error playing audio: ", error);
            });
        };
    </script>

</body>
</html>
